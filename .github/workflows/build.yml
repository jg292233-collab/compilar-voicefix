name: Compilar CS2VoiceFix (Linux)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Entorno oficial de Valve (Steam Runtime "sniper"): asi el .so es compatible con el servidor
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    defaults:
      run:
        shell: bash
    env:
      XMAKE_ROOT: "y"
    steps:
      - name: Descargar codigo del plugin y SDK de Valve
        run: |
          git clone --depth 1 https://github.com/Source2ZE/CS2VoiceFix.git plugin
          git clone --depth 1 -b cs2 https://github.com/alliedmodders/hl2sdk.git /opt/hl2sdk-cs2

      - name: Descargar Metamod (misma version que tu servidor)
        env:
          MM_BUILD: "1483"
        run: |
          git clone https://github.com/alliedmodders/metamod-source.git /opt/metamod-source
          cd /opt/metamod-source
          TARGET=$(git rev-list --reverse --first-parent HEAD | sed -n "${MM_BUILD}p")
          if [ -n "$TARGET" ]; then git checkout -q "$TARGET"; fi
          echo "Metamod build usado: $(git rev-list --count HEAD)"
          git submodule update --init --recursive || git submodule update --init || true
          echo "--- submodulos de Metamod ---"
          git submodule status || true

      - name: Instalar xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Adaptar xmake.lua al SDK actual
        working-directory: plugin
        run: |
          # generichash.cpp ya no existe en el SDK actual
          sed -i '/generichash.cpp/d' xmake.lua
          # Definiciones que el SDK de Valve necesita en Linux (stricmp y compania)
          sed -i 's|"_LINUX",|"_LINUX",\n            "stricmp=strcasecmp",\n            "_stricmp=strcasecmp",\n            "strcmpi=strcasecmp",\n            "strnicmp=strncasecmp",\n            "_strnicmp=strncasecmp",\n            "_snprintf=snprintf",\n            "_vsnprintf=vsnprintf",\n            "_alloca=alloca",|' xmake.lua
          # Metamod nuevo puede necesitar khook.hpp: se agrega su carpeta si existe
          KH=$(find /opt/metamod-source -name khook.hpp | head -n 1 || true)
          if [ -n "$KH" ]; then
            KHDIR=$(dirname "$KH")
            echo "khook encontrado en: $KHDIR"
            sed -i "s|MM_PATH..\"/core/sourcehook\",|MM_PATH..\"/core/sourcehook\",\n        \"${KHDIR}\",|" xmake.lua
          else
            echo "khook no hace falta en esta version de Metamod"
          fi
          # sh_vector.h no existe en Metamod nuevo y el plugin no lo usa: se quita el include
          if [ -z "$(find /opt/metamod-source -name sh_vector.h | head -n 1)" ]; then
            echo "sh_vector.h no existe: se quita el include de src/extension.h"
            sed -i '/sh_vector.h/d' src/extension.h
          fi
          # CUtlMap ya no existe en el SDK actual: schema.cpp pasa a usar std::unordered_map
          python3 - <<'PY'
          import re
          f = "src/cs2_sdk/schema.cpp"
          t = open(f).read()

          def rep(old, new):
              global t
              assert old in t, "no se encontro: " + old
              t = t.replace(old, new)

          rep('#include "schema.h"', '#include <unordered_map>\n#include "schema.h"')
          rep('using SchemaKeyValueMap_t = CUtlMap<uint32_t, SchemaKey>;', 'using SchemaKeyValueMap_t = std::unordered_map<uint32_t, SchemaKey>;')
          rep('using SchemaTableMap_t = CUtlMap<uint32_t, SchemaKeyValueMap_t*>;', 'using SchemaTableMap_t = std::unordered_map<uint32_t, SchemaKeyValueMap_t*>;')
          rep('new SchemaKeyValueMap_t(0, 0, DefLessFunc(uint32_t))', 'new SchemaKeyValueMap_t()')
          rep('tableMap->Insert(classKey, map);', '(*tableMap)[classKey] = map;')
          rep('keyValueMap->EnsureCapacity(fieldsSize);', 'keyValueMap->reserve(fieldsSize);')
          rep('tableMap->Insert(classKey, keyValueMap);', '(*tableMap)[classKey] = keyValueMap;')
          rep('keyValueMap->Insert(hash_32_fnv1a_const(field.m_pszName), {field.m_nSingleInheritanceOffset, IsFieldNetworked(field)});',
              '(*keyValueMap)[hash_32_fnv1a_const(field.m_pszName)] = SchemaKey{field.m_nSingleInheritanceOffset, IsFieldNetworked(field)};')

          i = t.index("SchemaKey schema::GetOffset(")
          t = t[:i] + """SchemaKey schema::GetOffset(const char* className, uint32_t classKey, const char* memberName, uint32_t memberKey)
          {
              static SchemaTableMap_t schemaTableMap;
              auto tableIt = schemaTableMap.find(classKey);
              if (tableIt == schemaTableMap.end())
              {
                  if (InitSchemaFieldsForClass(&schemaTableMap, className, classKey))
                      return GetOffset(className, classKey, memberName, memberKey);

                  return { 0, 0 };
              }

              SchemaKeyValueMap_t *tableMap = tableIt->second;
              auto memberIt = tableMap->find(memberKey);
              if (memberIt == tableMap->end())
              {
                  Warning("schema::GetOffset(): '%s' was not found in '%s'!\\n", memberName, className);
                  return { 0, 0 };
              }

              return memberIt->second;
          }
          """
          open(f, "w").write(t)
          print("schema.cpp parcheado")
          PY
          # El SDK actual necesita RenderDeviceInfo_t declarado antes de iserver.h
          sed -i '0,/#include <stdio.h>/s//struct RenderDeviceInfo_t;\n#include <stdio.h>/' src/extension.cpp
          grep -n "RenderDeviceInfo_t" src/extension.cpp || true
          grep -n "stricmp\|generichash\|khook" xmake.lua || true

      - name: Compilar
        working-directory: plugin
        run: |
          set -o pipefail
          export HL2SDKCS2=/opt/hl2sdk-cs2
          export MMSOURCE112=/opt/metamod-source
          echo "Metamod build usado: $(git -C /opt/metamod-source rev-list --count HEAD)" | tee -a /tmp/build.log
          intento() {
            echo "=== Intento: compilador $1, lenguaje $2 ===" | tee -a /tmp/build.log
            sed -i "s/set_languages(\"cxx[0-9]*\")/set_languages(\"$2\")/" xmake.lua
            xmake clean -a || true
            xmake f -y -c -m release --toolchain=$1 >> /tmp/build.log 2>&1 && xmake -y -v 2>&1 | tee -a /tmp/build.log
          }
          intento clang cxx17 || intento gcc cxx20 || intento gcc cxx17

      - name: Resumen de errores (copia ESTO si falla)
        if: failure()
        run: |
          echo "===== RESUMEN ====="
          grep -n "Metamod build\|=== Intento" /tmp/build.log || true
          echo "----- errores -----"
          grep -h "error:" /tmp/build.log | grep -v "^error: In file" | sed 's/^.*\(src\/\|opt\/\)/\1/' | sort -u | head -n 45 || true

      - name: Diagnostico de Metamod (copia ESTO tambien si falla)
        if: failure()
        run: |
          cd /opt/metamod-source
          echo "--- carpeta core/sourcehook ---"
          ls core/sourcehook | head -40 || true
          echo "--- archivos sourcehook / sh_ en todo Metamod ---"
          find . \( -iname 'sourcehook*.h' -o -iname 'sh_*.h' \) | head -30
          echo "--- donde se define SH_DECL_HOOK6_void ---"
          grep -rl "define SH_DECL_HOOK6_void" . | head -5 || true
          echo "--- donde se define SH_NOATTRIB / META_IFACEPTR / SH_MEMBER ---"
          grep -rn "define SH_NOATTRIB\|define META_IFACEPTR\|define SH_MEMBER" . | head -10 || true
          echo "--- includes de ISmmAPI.h e ISmmPlugin.h ---"
          grep -n "#include\|__has_include" core/ISmmAPI.h core/ISmmPlugin.h | head -40
          echo "--- submodulos ---"
          git submodule status || true

      - name: Armar carpeta lista para copiar al servidor
        run: |
          SO=$(find plugin/build -name '*CS2VoiceFix.so' | head -n 1)
          echo "Archivo compilado: $SO"
          test -n "$SO"
          mkdir -p out/addons/CS2VoiceFix out/addons/metamod
          cp "$SO" out/addons/CS2VoiceFix/CS2VoiceFix.so
          printf '"Metamod Plugin"\n{\n\t"alias"\t"CS2VoiceFix"\n\t"file"\t"addons/CS2VoiceFix/CS2VoiceFix"\n}\n' > out/addons/metamod/CS2VoiceFix.vdf
          ls -R out

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: CS2VoiceFix-linux
          path: out/
